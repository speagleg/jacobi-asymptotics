name: lean

on:
  push:
    branches: [master]
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: [master]
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    name: lake build + axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}

      - name: Cache lake packages and build
        uses: actions/cache@v4
        with:
          path: |
            lean/.lake/build
            ~/.cache/mathlib
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ hashFiles('lean/**/*.lean') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-

      - name: Install elan (toolchain from lean/lean-toolchain)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        working-directory: lean
        run: |
          cat lean-toolchain
          lean --version
          lake --version

      # Downloads prebuilt Mathlib .olean files for the revision pinned in lake-manifest.json.
      # This is NOT `lake update`: the manifest is not modified (checked below).
      - name: Fetch Mathlib build cache
        working-directory: lean
        run: lake exe cache get

      - name: Manifest unchanged
        run: git diff --exit-code lean/lake-manifest.json

      - name: Build and axiom audit
        run: |
          set -o pipefail
          bash lean/check.sh 2>&1 | tee check.log
          grep -q "AUDIT OK" check.log || { echo "AUDIT OK not printed"; exit 1; }
